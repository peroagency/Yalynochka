name: Deploy Vite app (GitHub Pages + Hosting Ukraine FTP)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_ftp_secrets: ${{ steps.ftp-check.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check Hosting Ukraine FTP secrets
        id: ftp-check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_SERVER: $([ -n "$FTP_SERVER" ] && echo 'OK' || echo 'MISSING')"
          echo "FTP_USERNAME: $([ -n "$FTP_USERNAME" ] && echo 'OK' || echo 'MISSING')"
          echo "FTP_PASSWORD: $([ -n "$FTP_PASSWORD" ] && echo 'OK' || echo 'MISSING')"
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=FTP deploy skipped::Додайте Repository secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) у Settings -> Secrets and variables -> Actions -> Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact for FTP deploy
        if: steps.ftp-check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ftp-dist
          path: './dist'
          include-hidden-files: true

      - name: Add 404 fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp:
    name: Deploy to Hosting Ukraine (FTP)
    needs: build
    if: needs.build.outputs.has_ftp_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ftp-dist
          path: './dist'

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sync dist to Hosting Ukraine FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          export LFTP_PASSWORD="$FTP_PASSWORD"
          TARGET_DIR="${FTP_SERVER_DIR:-.}"

          run_lftp() {
            local ssl_allow="$1"
            local ssl_protect_data="$2"
            lftp -e "
              set cmd:fail-exit true;
              set ftp:ssl-allow ${ssl_allow};
              set ftp:ssl-force false;
              set ftp:ssl-protect-data ${ssl_protect_data};
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              set ftp:chmod no;
              set net:timeout 30;
              set net:max-retries 4;
              set net:reconnect-interval-base 3;
              set xfer:clobber on;
              open --env-password -u '${FTP_USERNAME}' '${FTP_SERVER}';
              mirror --reverse --delete --verbose --no-perms --parallel=2 --exclude-glob .nojekyll --exclude-glob '*.txt' --exclude-glob 'assets/aistudio/image_193189cc.png' --exclude-glob 'assets/aistudio/image_27c02062.png' --exclude-glob 'assets/aistudio/image_938f1a13.png' --exclude-glob 'assets/aistudio/image_967c3983.png' ./dist '${TARGET_DIR}';
              bye
            "
          }

          echo "Trying FTPS (TLS control + data)..."
          if run_lftp true true; then
            echo "FTP deploy succeeded (FTPS)"
            exit 0
          fi

          echo "FTPS data socket failed; retrying with TLS control only (PROT C)..."
          if run_lftp true false; then
            echo "FTP deploy succeeded (FTPS control / PROT C)"
            exit 0
          fi

          echo "TLS FTP failed; retrying with plain passive FTP..."
          run_lftp false false
          echo "FTP deploy succeeded (FTP)"
