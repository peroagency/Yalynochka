name: Deploy Vite app (GitHub Pages + Hosting Ukraine FTP)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_ftp_secrets: ${{ steps.ftp-check.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check Hosting Ukraine FTP secrets
        id: ftp-check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_SERVER: $([ -n "$FTP_SERVER" ] && echo 'OK' || echo 'MISSING')"
          echo "FTP_USERNAME: $([ -n "$FTP_USERNAME" ] && echo 'OK' || echo 'MISSING')"
          echo "FTP_PASSWORD: $([ -n "$FTP_PASSWORD" ] && echo 'OK' || echo 'MISSING')"
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=FTP deploy skipped::Додайте Repository secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) у Settings -> Secrets and variables -> Actions -> Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact for FTP deploy
        if: steps.ftp-check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ftp-dist
          path: './dist'
          include-hidden-files: true

      - name: Add 404 fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp:
    name: Deploy to Hosting Ukraine (FTP)
    needs: build
    if: needs.build.outputs.has_ftp_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ftp-dist
          path: './dist'

      - name: Sync dist to Hosting Ukraine FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .nojekyll
